<script>
const KEY='lcc-scoreboard-v1',$=s=>document.querySelector(s);

function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.scores)&&r.scores.length===3&&Array.isArray(r.names))return{...D,...r}}catch(e){}return{...D,names:[...D.names],scores:[0,0,0]}}

const board=$('#board');

const P=[...board.children];

$('#undo').onclick=()=>{if(hist.length){S.scores=hist.pop();save();render()}};
const rs=$('#reset');
function disarm(){armed=0;rs.textContent='Reset skor';rs.classList.remove('warn')}
rs.onclick=()=>{
  if(!armed){armed=1;rs.textContent='Yakin? Klik lagi';rs.classList.add('warn');setTimeout(disarm,3000)}
  else{disarm();hist.push(S.scores.slice());S.scores=[0,0,0];save();render()}

const fs=$('#fs');
if(!document.documentElement.requestFullscreen)fs.hidden=true;
fs.onclick=()=>{try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}catch(e){}};
// ---- Spin wheel + navigasi halaman ----
const PAL=['#d6264a','#c77700','#0b8a5c','#2368d9','#7c4dcc','#c2358a','#0f8f9b','#d4571a'];
const cv=$('#wheel'),c2=cv.getContext('2d'),box=$('#wheelBox'),ta=$('#items'),spinB=$('#spin'),resEl=$('#result'),histEl=$('#hlist'),rmEl=$('#rm'),pT=$('#pTeams'),pN=$('#pNums');
let rot=0,spinning=false;const hs=[];
if(typeof S.items!=='string')S.items=S.names.join('\n');
ta.value=S.items;rmEl.checked=!!S.rm;
const list=()=>ta.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,40);
function draw(){
  const w=box.clientWidth;if(!w)return;
  const items=list(),n=items.length,dpr=window.devicePixelRatio||1,px=Math.round(w*dpr),c=c2;
  if(cv.width!==px)cv.width=cv.height=px;
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,w);

  if(n<2){
    c.beginPath();c.arc(0,0,R,0,7);c.fillStyle=st.getPropertyValue('--line');c.fill();
    c.fillStyle=st.getPropertyValue('--muted');c.font=`700 ${w*.045}px Rubik,sans-serif`;c.textAlign='center';c.fillText('Isi minimal 2 pilihan',0,-R*.45);
  }else{
    const seg=2*Math.PI/n;c.rotate(rot);
    for(let i=0;i<n;i++){
      let k=i%PAL.length;if(i===n-1&&k===0)k=4;
      c.beginPath();c.moveTo(0,0);c.arc(0,0,R,i*seg,(i+1)*seg);c.closePath();
      c.fillStyle=PAL[k];c.fill();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;c.stroke();
      c.save();c.rotate((i+.5)*seg);c.fillStyle='#fff';c.textAlign='right';c.textBaseline='middle';
      c.font=`700 ${Math.max(10,Math.min(w*.06,R*seg*.42))}px Rubik,sans-serif`;
      let t=items[i];const mx=R*.62;
      while(c.measureText(t).width>mx&&t.length>1)t=t.slice(0,-1);
      if(t!==items[i])t=t.trimEnd()+'\u2026';
      c.fillText(t,R-16,0);c.restore();

const lock=b=>{[ta,rmEl,pT,pN].forEach(e=>e.disabled=b);spinB.disabled=b||list().length<2};
function sync(){spinB.disabled=spinning||list().length<2;draw()}
const winner=n=>{const s=2*Math.PI/n,th=((-Math.PI/2-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);return Math.floor(th/s)%n};
function finish(items){
  const i=winner(items.length),name=items[i];
  resEl.className='result done bump';resEl.textContent=name;
  hs.unshift(name);histEl.replaceChildren(...hs.slice(0,8).map(x=>{const li=document.createElement('li');li.textContent=x;return li}));$('#hhead').hidden=false;

}

  const items=list();if(spinning||items.length<2)return;
  spinning=true;lock(true);resEl.className='result';resEl.textContent='Berputar\u2026';
  const from=rot,total=(6+Math.random()*3)*2*Math.PI+Math.random()*2*Math.PI,dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1200:5200,t0=performance.now();

    const p=Math.min(1,(t-t0)/dur);rot=from+total*(1-Math.pow(1-p,4));draw();

ta.oninput=()=>{S.items=ta.value;save();sync()};
rmEl.onchange=()=>{S.rm=rmEl.checked;save()};
pT.onclick=()=>{ta.value=S.names.join('\n');ta.oninput()};
pN.onclick=()=>{ta.value=Array.from({length:10},(_,i)=>'Soal '+(i+1)).join('\n');ta.oninput()};

$('#theme').addEventListener('click',draw);
if(document.fonts)document.fonts.ready.then(draw);

// ---- Halaman Soal + sinkron antar perangkat (db) ----
function mkSync(path,get,ok,apply,delay){
  let ref=null,last='',busy=0,dirty=0,t=0;
  const flush=()=>{if(busy||!dirty)return;busy=1;dirty=0;ref.set(get()).catch(()=>{}).finally(()=>{busy=0;flush()})};
  const o={
    get on(){return !!ref},
    push(){if(!ref)return;clearTimeout(t);t=setTimeout(()=>{t=0;const s=JSON.stringify(get());if(s===last)return;last=s;dirty=1;flush()},delay)},
    async init(){try{const db=window.claude&&await claude.use('db');if(!db)return;ref=db.doc(path);
      ref.onSnapshot(sn=>{const d=sn.exists&&sn.data();const idle=!busy&&!dirty&&!t;
        if(d&&ok(d)){if(idle){apply(d);last=JSON.stringify(get())}}else if(idle){last='';o.push()}},()=>{ref=null})}catch(e){}}
  };
  return o;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>(v<0?'−':'')+Math.abs(v);

  d=>Array.isArray(d.scores)&&d.scores.length===3&&Array.isArray(d.names)&&d.names.length===3,
  d=>{S.title=String(d.title||'');S.names=d.names.map(String);S.scores=d.scores.map(Number);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(title.value!==S.title)title.value=S.title;P.forEach((p,i)=>{const n=p.querySelector('.name');if(n.value!==S.names[i])n.value=S.names[i]});render();soalSb()},250);
const SK='lcc-soal-v1';
const fix=(a,n)=>Array.from({length:n},(_,i)=>{const x=a&&a[i]||{};return{t:x.t==='N'?'N':'L',q:String(x.q||''),k:String(x.k||'')}});
const DN={s1:[5,5,5],s2:[3,3,3],s3:[15]},sm=a=>a.reduce((x,y)=>x+y,0);
const normQ=d=>{const n={};for(const s in DN){n[s]=d&&d.n&&Array.isArray(d.n[s])&&d.n[s].length===DN[s].length?d.n[s].map(x=>Math.max(0,Math.min(100,x|0))):DN[s].slice()}return{s1:fix(d&&d.s1,sm(n.s1)),s2:fix(d&&d.s2,sm(n.s2)),s3:fix(d&&d.s3,sm(n.s3)),n}};

const qSync=mkSync('lcc/soal',()=>Q,d=>d.s1&&d.s2&&d.s3,d=>{Q=normQ(d);try{localStorage.setItem(SK,JSON.stringify(Q))}catch(e){}
  if(mode==='menu'||(mode==='edit'&&!V.contains(document.activeElement)))V.hidden||(mode==='menu'?soalMenu():V.innerHTML=editHTML())},800);
var rq;const saveQ=()=>{try{localStorage.setItem(SK,JSON.stringify(Q))}catch(e){}qSync.push();clearTimeout(rq);rq=setTimeout(()=>roomPush('soal'),800)};

const loadMqtt=()=>new Promise((ok,no)=>{if(window.mqtt)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';s.onload=ok;s.onerror=()=>no('Gagal memuat pustaka room (periksa internet)');document.head.appendChild(s)});
const openMq=code=>new Promise((ok,no)=>{

function attach(c,code){
  Room.cl=c;Room.code=code;Room.st='on';Room.last={};Room.peers={};Room.got=0;Room.lock=null;Room.lk=false;Room.kp=rkey(code);

  c.on('connect',()=>{Room.st='on';roomUi()});c.on('offline',()=>{Room.st='off';roomUi()});
  c.subscribe(b+'+',{qos:1});
  const hb=()=>{if(c.connected)c.publish(b+'hb',JSON.stringify({id:Room.id,from:Room.id}))};
  clearInterval(Room.hb);Room.hb=setInterval(()=>{hb();if(mode==='show')pushLock(Room.id);const l=lockedByOther();if(l!==Room.lk){Room.lk=l;if(mode==='menu')soalMenu()}roomUi()},8000);hb();

async function roomCreate(){
  setErr('Menghubungkan…');let er='';
  for(const L of ['E','H']){
    const code=L+Array.from({length:5},()=>AL[Math.random()*32|0]).join('');
    try{await loadMqtt();const c=await openMq(code);attach(c,code);['scores','verdict','pos','soal','cfg'].forEach(roomPush);setErr('');roomUi(1);return}catch(e){er=String(e)}
  }
  setErr(er);
}
async function roomJoin(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6||!BR[code[0]])return setErr('Kode harus 6 karakter');
  setErr('Menghubungkan…');
  try{
    await loadMqtt();const c=await openMq(code);attach(c,code);
    for(let i=0;i<20&&!Room.got;i++)await new Promise(r=>setTimeout(r,150));
    if(!Room.got){roomLeave();return setErr('Kode tidak ditemukan')}
    setErr('');roomUi(1);
  }catch(e){setErr(String(e))}
}

  const sig=[!!Room.cl,Room.st,n].join();if(!force&&sig===Room.ui)return;Room.ui=sig;
  $('#roomBody').innerHTML=Room.cl
   ?'<div class="rcode">'+fc(Room.code)+'</div><div class="or">'+n+' perangkat terhubung'+(on?'':' (menyambung ulang…)')+'</div><div class="rrow"><button class="g" id="rmCopy">Salin kode</button><button class="g" id="rmLink">Tautan operator</button><button class="g" id="rmLeave">Keluar</button><button class="g" id="rmWipe">Hapus data room</button></div><p class="dn">Room memakai server publik. Soal dikirim terenkripsi dengan kunci dari kode room; skor, penilaian, dan posisi soal tidak terenkripsi.</p>'
   :'<p class="dn">Buat room lalu bagikan kodenya. Satu perangkat membuka tab Operator untuk input skor dan penilaian, perangkat lain menampilkan di proyektor.</p><button class="g big" id="rmNew">Buat Room</button><div class="or">atau</div><div class="rj"><input id="rmCode" placeholder="KODE" maxlength="7" autocapitalize="characters" autocomplete="off"><button class="g big" id="rmJoin">Gabung</button></div><div class="rerr" id="rmErr">'+esc(Room.err)+'</div>';
}
const cp=t=>{try{navigator.clipboard.writeText(t)}catch(e){}};
$('#roomBtn').onclick=()=>{$('#roomDlg').hidden=false;roomUi(1)};
$('#roomDlg').onclick=e=>{
  const b=e.target.closest('button');
  if(e.target.id==='roomDlg'||(b&&b.id==='roomClose')){$('#roomDlg').hidden=true;return}
  if(!b)return;
  if(b.id==='rmNew')roomCreate();
  else if(b.id==='rmJoin')roomJoin($('#rmCode').value);
  else if(b.id==='rmLeave')roomLeave();
  else if(b.id==='rmWipe')roomWipe(b);
  else if(b.id==='rmCopy')cp(Room.code);
  else if(b.id==='rmLink')cp(location.href.split('#')[0]+'#room-'+Room.code+'-op');
};
const skin=$('#skin');skin.value=S.skin||'';
const applySkin=()=>{if(S.skin)document.documentElement.dataset.skin=S.skin;else delete document.documentElement.dataset.skin;try{draw()}catch(e){}};
skin.onchange=()=>{S.skin=skin.value;applySkin();save()};applySkin();
var CFG={sb:'end',t1:10,t2:5},cfgOpen=false;
function normCfg(c){return{sb:c&&c.sb==='all'?'all':'end',t1:Math.max(5,Math.min(10,+(c&&c.t1)||10)),t2:Math.max(5,Math.min(10,+(c&&c.t2)||5))}}
try{CFG=normCfg(JSON.parse(localStorage.getItem('lcc-cfg-v1')))}catch(e){CFG=normCfg(null)}
function saveCfg(){try{localStorage.setItem('lcc-cfg-v1',JSON.stringify(CFG))}catch(e){}roomPush('cfg')}
const sbOn=()=>CFG.sb==='all'||cur===3;
function throwTo(n,rem){
  const st=steps[pos];if(!st||st.s!=='s2'||n<=ph||n>2)return;
  ph=n;if(!rem)vset(st.s+':'+st.i+'#',n);
  const i=(st.team+n)%3,e=$('#turn');
  if(e){e.style.setProperty('--c','var(--t'+i+')');e.textContent='Giliran: '+S.names[i]}
  stopT();vstop=false;startT(n===1?CFG.t1:CFG.t2);
}
function thrSync(){
  const st=steps[pos];if(mode!=='show'||!st||st.k!=='q'||st.s!=='s2'||vget(st.s+':'+st.i))return;
  const n=+vget(st.s+':'+st.i+'#')||0;if(n<=ph)return;
  const t=$('#thr');if(t){t.hidden=false;t.textContent='Soal dilempar ke tim berikutnya'}
  vdSound('S');throwTo(n,true);
}
function opThrow(){const p=POS;if(!(p&&p.k==='q'&&p.s==='s2')||vget(p.s+':'+p.i))return;const n=(+vget(p.s+':'+p.i+'#')||0)+1;if(n>2)return;vset(p.s+':'+p.i+'#',n);vdRefresh();opRender()}
function thBlock(p,v,n){
  const nx=(p.team+n+1)%3,off=n>=2||v;
  return '<div class="opth"><small>Lemparan: tim ke-'+(n+1)+' dari 3 sedang menjawab</small><button class="g big" data-th="1"'+(off?' disabled':'')+'>'+(n>=2?'Tidak ada tim berikutnya':'Reset dan lempar ke '+esc(S.names[nx])+' ('+(n===0?CFG.t1:CFG.t2)+' dtk)')+'</button></div>';
}
function cfgBlock(){
  const o=v=>[5,6,7,8,9,10].map(s=>'<option value="'+s+'"'+(s===v?' selected':'')+'>'+s+' detik</option>').join('');
  return '<details class="ocfg"'+(cfgOpen?' open':'')+'><summary>Pengaturan</summary><div class="cfr"><span>Papan skor</span><div class="seg"><button data-cf="sb" data-cv="end" class="'+(CFG.sb==='end'?'on':'')+'">Hanya di akhir</button><button data-cf="sb" data-cv="all" class="'+(CFG.sb==='all'?'on':'')+'">Setiap babak</button></div></div><div class="cfr"><span>Waktu lemparan ke tim ke-2</span><select data-cfs="t1">'+o(CFG.t1)+'</select></div><div class="cfr"><span>Waktu lemparan ke tim ke-3</span><select data-cfs="t2">'+o(CFG.t2)+'</select></div></details>';
}
$('#opView').onchange=e=>{const t=e.target;if(t.dataset&&t.dataset.cfs){CFG[t.dataset.cfs]=+t.value;CFG=normCfg(CFG);saveCfg()}};
$('#opView').addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('ocfg'))cfgOpen=e.target.open},true);
var base=null,vstop=false;
function reEdit(){const t=V.scrollTop;V.innerHTML=editHTML();V.scrollTop=t}
function addQ(v){const[s,g]=v.split(':'),G=+g;if(mode!=='edit'||Q.n[s][G]>=100)return;Q[s].splice(rg(s)[G][1],0,{t:'L',q:'',k:''});Q.n[s][G]++;saveQ();reEdit();const t=V.querySelectorAll('.eq textarea');if(t.length)t[t.length-1].focus()}
function delQ(b){
  if(mode!=='edit')return;
  const[s,i]=b.dataset.del.split(':'),I=+i,it=Q[s][I];
  if(it&&(it.q||it.k)&&!b.dataset.arm){b.dataset.arm=1;b.textContent='Hapus?';setTimeout(()=>{if(b.isConnected){b.textContent='✕';delete b.dataset.arm}},2500);return}
  const G=rg(s).findIndex(x=>I>=x[0]&&I<x[1]);if(G<0)return;
  Q[s].splice(I,1);Q.n[s][G]--;saveQ();reEdit();
}
function vsync(){const st=steps[pos];if(mode!=='show'||!st||st.k!=='q'||!st.timer)return;const s=!!vget(st.s+':'+st.i);if(s!==vstop){vstop=s;paint()}}
const vget=k=>(VD[k]&&VD[k].v)||'';
function vset(k,v){VD[k]={v,t:Date.now()};roomPush('verdict')}
function mergeVd(m){let loc=false;for(const k in m){if(m[k]&&(!VD[k]||m[k].t>VD[k].t))VD[k]=m[k]}for(const k in VD){if(!m[k]||m[k].t<VD[k].t)loc=true}return loc}
function lockedByOther(){const l=Room.lock;return !!(Room.cl&&l&&l.h&&l.h!==Room.id&&Date.now()-l.at<20000)}
function pushLock(h,to){const c=Room.cl;Room.lock={h,at:Date.now()};if(c&&c.connected)c.publish('lccwik/v1/'+Room.code+'/lock',JSON.stringify({h,to:!!to,from:Room.id,t:Date.now()}),{qos:1,retain:true})}
function claim(){if(lockedByOther())return false;if(Room.cl)pushLock(Room.id);return true}
function releaseLock(){if(Room.cl&&Room.lock&&Room.lock.h===Room.id)pushLock(null)}
function takeOver(b){if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Yakin? Klik lagi';setTimeout(()=>{if(b.isConnected){b.textContent='Ambil alih';delete b.dataset.arm}},3000);return}pushLock(Room.id,1);soalMenu()}
function roomWipe(b){
  if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Yakin? Klik lagi';setTimeout(()=>{if(b.isConnected){b.textContent='Hapus data room';delete b.dataset.arm}},3000);return}
  const c=Room.cl;Room.lock=null;
  if(c&&c.connected)['scores','verdict','pos','soal','lock','cfg'].forEach(t=>c.publish('lccwik/v1/'+Room.code+'/'+t,'',{qos:1,retain:true}));
  setTimeout(roomLeave,400);
}
function countUp(){
  if(!base)return;const els=[...V.querySelectorAll('.score')];if(!els.length)return;const t0=performance.now(),dur=1100;
  (function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);els.forEach((el,i)=>{el.textContent=fmt(Math.round(base[i]+(S.scores[i]-base[i])*e))});if(p<1&&mode==='show'&&steps[pos]&&steps[pos].k==='sb')requestAnimationFrame(f)})(t0);
}
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=u=>btoa(Array.from(u,c=>String.fromCharCode(c)).join('')),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function rkey(code){if(!(window.crypto&&crypto.subtle))return null;const m=await crypto.subtle.importKey('raw',TE.encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:TE.encode('lccwik-v1'),iterations:60000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function pushSoal(){
  const c=Room.cl,key=await Room.kp;if(!c||!c.connected||!key)return;
  const s=JSON.stringify(Q);if(Room.last.soal===s)return;Room.last.soal=s;
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(s));
  c.publish('lccwik/v1/'+Room.code+'/soal',JSON.stringify({iv:b64(iv),ct:b64(new Uint8Array(ct)),from:Room.id,t:Date.now()}),{qos:1,retain:true});
}
async function recvSoal(d){
  try{
    const key=await Room.kp;if(!key||!d.iv||!d.ct)return;
    const s=TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.iv)},key,ub64(d.ct)));
    Q=normQ(JSON.parse(s));Room.last.soal=JSON.stringify(Q);try{localStorage.setItem(SK,JSON.stringify(Q))}catch(e){}
    if(mode==='menu')soalMenu();else if(mode==='edit'&&!V.contains(document.activeElement))V.innerHTML=editHTML();
    opRender();
  }catch(e){}
}
(function(){const m=/^#room-([A-Za-z0-9]{6})(-op)?$/.exec(location.hash);let c=m?m[1]:null;if(m&&m[2])S.view='op';if(!c){try{c=localStorage.getItem('lcc-room')}catch(e){}}if(c)roomJoin(c)})();
view(['wheel','soal','op'].includes(S.view)?S.view:'score');
render();
</script>
</body>
